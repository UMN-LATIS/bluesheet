name: Tests

on: [push, pull_request, workflow_dispatch]

env:
  # .env.example points at the Sail service names. Real environment variables
  # win over .env, so these redirect the app at the runner's own services.
  # The database runs as a throwaway container, so we connect as root rather
  # than granting a second user access to the test database.
  DB_HOST: 127.0.0.1
  DB_USERNAME: root
  DB_PASSWORD: password
  APP_URL: http://localhost:8000

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: bluesheet
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: cp .env.example .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Composer dependencies
        run: |
          php --version
          composer config "http-basic.nova.laravel.com" "${{ secrets.NOVA_USERNAME }}" "${{ secrets.NOVA_LICENSE_KEY }}"
          composer install --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Setup Laravel
        run: ./bin/ci.sh

      # phpunit.xml points the Pest suite at its own database. The service
      # container only creates the one named in MYSQL_DATABASE.
      - name: Create test database
        run: php -r '(new PDO("mysql:host=127.0.0.1", "root", "password"))->exec("CREATE DATABASE IF NOT EXISTS testing");'

      # Cypress drives the served app, which reads the database named in .env.
      - name: Migrate and seed
        run: php artisan migrate:fresh --seed

      - name: Run integration tests with Pest
        run: ./vendor/bin/pest

      - name: Install NPM dependencies
        run: npm ci

      - name: Run unit tests with Vitest
        run: npm run test:unit

      - name: Build client app
        run: npm run build

      - name: Run E2E tests with Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: php artisan serve --port=8000
          wait-on: "http://localhost:8000"
          browser: chrome
          config: baseUrl=http://localhost:8000

      - name: Upload test screenshots if any
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: tests/cypress/screenshots
